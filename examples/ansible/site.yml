---
- name: Exercise fake-satellite with redhat.satellite modules
  hosts: localhost
  gather_facts: false

  vars:
    # Works with both fake-satellite example vars and legacy role vars.
    satellite_common_args: &satellite_common_args
      server_url: "{{ satellite_server_url | default(fake_satellite_server_url) }}"
      username: "{{ satellite_username | default(fake_satellite_username) }}"
      password: "{{ satellite_password | default(fake_satellite_password) }}"
      validate_certs: "{{ satellite_validate_certs | default(fake_satellite_validate_certs) }}"
    satellite_organization_name: "{{ satellite_organization | default(fake_satellite_organization) }}"

  tasks:
    - name: List organizations
      redhat.satellite.organization_info:
        <<: *satellite_common_args
      register: organizations

    - name: Show organizations returned by the API
      ansible.builtin.debug:
        msg: "{{ organizations.organizations | map(attribute='name') | list }}"

    - name: Ensure example domain exists
      redhat.satellite.domain:
        <<: *satellite_common_args
        name: lab.example.com
        description: Lab domain managed by Ansible
        organizations:
          - "{{ satellite_organization_name }}"
        state: present

    - name: Ensure content view exists
      redhat.satellite.content_view:
        <<: *satellite_common_args
        organization: "{{ satellite_organization_name }}"
        name: RHEL8_Base
        description: Base content view for RHEL 8 hosts
        state: present

    - name: List content views in the organization
      redhat.satellite.content_view_info:
        <<: *satellite_common_args
        organization: "{{ satellite_organization_name }}"
      register: content_views

    - name: Show content views returned by the API
      ansible.builtin.debug:
        msg: "{{ content_views.content_views | map(attribute='name') | list }}"

    - name: Publish content view and promote to Development
      redhat.satellite.content_view_version:
        <<: *satellite_common_args
        organization: "{{ satellite_organization_name }}"
        content_view: RHEL8_Base
        lifecycle_environments:
          - Development
        state: present
